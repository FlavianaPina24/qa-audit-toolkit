name: Java CI & QA Audit

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  audit:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin

      - name: Cache Maven local repository
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Install Playwright Chromium & OS Dependencies
        run: mvn exec:java -e -D exec.mainClass=com.microsoft.playwright.CLI -D exec.args="install chromium --with-deps"

      - name: Run QA Audit Tests
        run: mvn -B test -Dvisual.threshold=0.25

      - name: Upload Audit Reports & Screenshots
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qa-audit-reports
          path: |
            target/Auditoria_Website_*.html
            target/test-reports/
            target/surefire-reports/
          retention-days: 14
