name: Java CI & QA Audit

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin

      - name: Cache Maven local repository
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Install Playwright Chromium & OS Dependencies
        run: mvn exec:java -e -D exec.mainClass=com.microsoft.playwright.CLI -D exec.args="install chromium --with-deps"

      - name: Run QA Audit Tests
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: mvn -B test -Dvisual.threshold=0.25

      - name: Upload Audit Reports & Screenshots (Artifacts)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qa-audit-reports
          path: |
            target/Auditoria_Website_*.html
            target/index.html
            target/test-reports/
            target/surefire-reports/
          retention-days: 14

      - name: Prepare GitHub Pages directory
        if: always() && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
        run: |
          mkdir -p public
          if [ -f target/index.html ]; then
            cp target/index.html public/index.html
          else
            LATEST_REPORT=$(ls -t target/Auditoria_Website_*.html 2>/dev/null | head -n 1)
            if [ -n "$LATEST_REPORT" ]; then
              cp "$LATEST_REPORT" public/index.html
            fi
          fi
          if [ -d target/test-reports/screenshots ]; then
            cp -r target/test-reports/screenshots public/
          fi

      - name: Upload GitHub Pages artifact
        if: always() && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'public'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: audit
    if: always() && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
